name: Publish container image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/michi-admin-frontend

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_ADMIN_API_URL=https://michi-admin.124-111-245-7.sslip.io/api/admin
            NEXT_PUBLIC_PUBLIC_API_URL=https://michi.124-111-245-7.sslip.io/michi/api
            NEXT_PUBLIC_API_URL=https://michi.124-111-245-7.sslip.io/michi/api
            NEXT_PUBLIC_APP_ENV=production
            NEXT_PUBLIC_ADMIN_DEMO_MODE=false
            NEXT_PUBLIC_ADMIN_AUTH_MODE=session
